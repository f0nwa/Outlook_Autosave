<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Outlook Autosave</title>
  <desc id="desc">Слева название и описание: надстройка сохраняет вложения из писем Outlook в папки на диске по правилам. Справа форма правил надстройки: список правил и поля правила «Счета PDF» — расширение pdf, тема «Счет», исходная папка Outlook и целевая папка D:\Документы\Счета.</desc>

  <defs>
    <clipPath id="frame"><rect width="1200" height="410" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif">
    <rect width="1200" height="410" fill="#E9EDF2"/>

    <!-- Название -->
    <g transform="translate(60 44) scale(0.875)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
      <path d="M10 40 v12 a3 3 0 0 0 3 3 h38 a3 3 0 0 0 3 -3 v-12" stroke="#56657A"/>
      <path d="M40 26 V14 a8 8 0 0 0 -16 0 V42" stroke="#2F6FB5"/>
      <path d="M16 35 L24 43 L32 35" stroke="#2F6FB5"/>
      <path d="M32 14 V28" stroke="#2F6FB5"/>
    </g>
    <text x="64" y="148" font-size="48" font-weight="600" fill="#1B1B1B">Outlook Autosave</text>
    <text x="64" y="200" font-size="23" fill="#3B3B3B">Сохраняет вложения из писем</text>
    <text x="64" y="232" font-size="23" fill="#3B3B3B">Outlook в папки на диске</text>
    <text x="64" y="264" font-size="23" fill="#3B3B3B">по правилам</text>
    <text x="64" y="320" font-size="18" fill="#555B63">Классический Outlook · только Windows · MIT</text>

    <!-- Окно формы правил -->
    <rect x="536" y="40" width="616" height="400" rx="8" fill="#F3F3F3" stroke="#B4BCC5" stroke-width="1.5"/>
    <path d="M536 48 a8 8 0 0 1 8 -8 h600 a8 8 0 0 1 8 8 v36 h-616 z" fill="#FFFFFF"/>
    <line x1="536" y1="84" x2="1152" y2="84" stroke="#DADADA" stroke-width="1"/>
    <text x="556" y="69" font-size="17" fill="#1B1B1B">Правила сортировки вложений</text>

    <!-- Список правил -->
    <rect x="556" y="100" width="576" height="108" fill="#FFFFFF" stroke="#ABABAB" stroke-width="1"/>
    <rect x="557" y="101" width="574" height="35" fill="#CCE4F7"/>
    <g font-size="18" fill="#1B1B1B">
      <text x="570" y="125">✓</text>
      <text x="600" y="125">1. Счета PDF</text>
      <text x="570" y="160">✓</text>
      <text x="600" y="160">2. Акты сверки</text>
      <text x="600" y="195" fill="#6B6B6B">3. прайс [xlsx] -&gt; D:\Прайсы</text>
    </g>

    <!-- Поля правила -->
    <g font-size="16" fill="#3B3B3B">
      <text x="556" y="236">Расширения</text>
      <text x="852" y="236">Тема письма</text>
      <text x="556" y="304">Исходная папка Outlook</text>
      <text x="852" y="304">Целевая папка</text>
    </g>
    <g fill="#FFFFFF" stroke="#ABABAB" stroke-width="1">
      <rect x="556" y="244" width="280" height="34"/>
      <rect x="852" y="244" width="280" height="34"/>
      <rect x="556" y="312" width="280" height="34"/>
      <rect x="852" y="312" width="280" height="34"/>
    </g>
    <g font-size="17" fill="#1B1B1B">
      <text x="566" y="267">pdf</text>
      <text x="862" y="267">Счет</text>
      <text x="566" y="335" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15">\\Почта\Входящие\Поставщики</text>
      <text x="862" y="335" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15">D:\Документы\Счета</text>
    </g>

    <!-- Кнопки -->
    <g fill="#FDFDFD" stroke="#ADADAD" stroke-width="1">
      <rect x="556" y="364" width="112" height="34"/>
      <rect x="678" y="364" width="112" height="34"/>
      <rect x="800" y="364" width="104" height="34"/>
      <rect x="914" y="364" width="120" height="34" stroke="#0067C0"/>
    </g>
    <g font-size="17" fill="#1B1B1B" text-anchor="middle">
      <text x="612" y="387">Добавить</text>
      <text x="734" y="387">Обновить</text>
      <text x="852" y="387">Удалить</text>
      <text x="974" y="387">Отключить</text>
    </g>
  </g>
</svg>
