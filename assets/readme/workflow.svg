<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Как работает автосохранение</title>
  <desc id="desc">Три шага. Письмо «Счет № 1042 за сентябрь» с вложениями invoice_1042.pdf и logo.png приходит в папку Outlook «Поставщики». Надстройка проверяет папку по интервалу: в статусе видны последний и следующий запуск. В папке D:\Документы\Счета появляется только invoice_1042.pdf и служебный файл autosave.index.</desc>

  <defs>
    <clipPath id="frame"><rect width="1200" height="380" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif">
    <rect width="1200" height="380" fill="#E9EDF2"/>

    <!-- 1. Outlook -->
    <rect x="48" y="40" width="340" height="236" fill="#FFFFFF" stroke="#C3C9D0" stroke-width="1"/>
    <text x="64" y="68" font-size="16" fill="#5C5C5C">Outlook</text>
    <line x1="48" y1="80" x2="388" y2="80" stroke="#E1E1E1"/>
    <text x="64" y="112" font-size="18" fill="#1B1B1B">Входящие</text>
    <rect x="49" y="124" width="338" height="36" fill="#CCE4F7"/>
    <text x="84" y="148" font-size="18" fill="#1B1B1B">Поставщики</text>
    <line x1="48" y1="200" x2="388" y2="200" stroke="#E1E1E1"/>
    <text x="64" y="228" font-size="18" font-weight="600" fill="#1B1B1B">Счет № 1042 за сентябрь</text>
    <text x="64" y="256" font-size="16" fill="#5C5C5C">invoice_1042.pdf · logo.png</text>

    <!-- 2. Статус надстройки -->
    <rect x="428" y="40" width="380" height="236" fill="#F3F3F3" stroke="#C3C9D0" stroke-width="1"/>
    <rect x="428.5" y="40.5" width="379" height="39" fill="#FFFFFF"/>
    <text x="444" y="68" font-size="16" fill="#5C5C5C">Outlook Autosave — статус</text>
    <line x1="428" y1="80" x2="808" y2="80" stroke="#E1E1E1"/>
    <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#1B1B1B">
      <text x="444" y="114">Автосохранение: Включено</text>
      <text x="444" y="144">Интервал автосохранения: 15m</text>
      <text x="444" y="174">Период обработки: 7d</text>
      <text x="444" y="204">Последний запуск: 2026-10-01 09:15:00</text>
      <text x="444" y="234">Следующий запуск: 2026-10-01 09:30:00</text>
    </g>

    <!-- 3. Папка на диске -->
    <rect x="848" y="40" width="304" height="236" fill="#FFFFFF" stroke="#C3C9D0" stroke-width="1"/>
    <text x="864" y="68" font-size="16" fill="#5C5C5C">D:\Документы\Счета</text>
    <line x1="848" y1="80" x2="1152" y2="80" stroke="#E1E1E1"/>
    <g font-size="18" fill="#1B1B1B">
      <text x="864" y="114">invoice_0987.pdf</text>
      <text x="864" y="148">act_0915.pdf</text>
      <rect x="849" y="160" width="302" height="36" fill="#CCE4F7"/>
      <text x="864" y="184">invoice_1042.pdf</text>
      <text x="864" y="218" fill="#8A8A8A">autosave.index</text>
    </g>

    <!-- Стрелки -->
    <g fill="none" stroke="#3B4552" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M396 158 H420 M413 151 L420 158 L413 165"/>
      <path d="M816 158 H840 M833 151 L840 158 L833 165"/>
    </g>

    <!-- Подписи -->
    <g font-size="19" fill="#2E3742">
      <text x="48" y="320">Письмо пришло в папку правила</text>
      <text x="428" y="320">Проверка по интервалу</text>
      <text x="848" y="320">Сохранен только PDF</text>
    </g>
  </g>
</svg>
